name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java environment
        run: |
          echo "JAVA_HOME=${JAVA_HOME:-}"
          if ! command -v java >/dev/null 2>&1; then
            echo "ERROR: Java executable could not be detected on PATH."
            exit 1
          fi
          java -version
          JAVA_VER_LINE="$(java -version 2>&1 | head -n 1)"
          RAW_VER="$(echo "$JAVA_VER_LINE" | sed -n 's/.*"\([^"]*\)".*/\1/p')"
          if [ -z "$RAW_VER" ]; then
            echo "ERROR: Could not parse active Java version from: $JAVA_VER_LINE"
            exit 1
          fi
          MAJOR_VER="$(echo "$RAW_VER" | awk -F. '{if ($1 == "1") print $2; else print $1}' | sed 's/[^0-9].*//')"
          if [ -z "$MAJOR_VER" ]; then
            echo "ERROR: Could not determine Java major version from: $RAW_VER"
            exit 1
          fi
          echo "Detected Java major version: $MAJOR_VER"
          if [ "$MAJOR_VER" -lt 17 ]; then
            echo "ERROR: Java 17 or newer is required, but detected Java $MAJOR_VER."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            KEYTOOL_BIN="keytool"
            if [ -n "${JAVA_HOME:-}" ] && [ -x "${JAVA_HOME}/bin/keytool" ]; then
              KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
            fi
            if ! command -v "$KEYTOOL_BIN" >/dev/null 2>&1; then
              echo "ERROR: keytool not found in configured Java installation."
              exit 1
            fi
            "$KEYTOOL_BIN" -genkeypair \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -noprompt
          fi
          if [ ! -f ./debug.keystore ] || [ ! -s ./debug.keystore ]; then
            echo "ERROR: Temporary ./debug.keystore could not be created or is empty."
            exit 1
          fi
          echo "Temporary debug keystore is ready."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "$TARGET_APK" ] || [ ! -f "$TARGET_APK" ] || [ ! -s "$TARGET_APK" ]; then
            echo "ERROR: Expected APK not found or empty at $TARGET_APK"
            if [ -d "app/build/outputs/apk" ]; then
              echo "APK paths discovered under app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name "*.apk" || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          case "$TARGET_APK" in
            *.apk) ;;
            *)
              echo "ERROR: Verified file does not have .apk extension: $TARGET_APK"
              exit 1
              ;;
          esac
          echo "Verified debug APK at $TARGET_APK ($(wc -c < "$TARGET_APK") bytes)."

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_release_asset
        run: |
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$SOURCE_APK" ] || [ ! -s "$SOURCE_APK" ]; then
            echo "ERROR: Source APK is missing or empty: $SOURCE_APK"
            exit 1
          fi
          RELEASE_DIR="$(mktemp -d "${RUNNER_TEMP}/apk-release.XXXXXX")"
          ASSET_PATH="${RELEASE_DIR}/app-debug.apk"
          cp "$SOURCE_APK" "$ASSET_PATH"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Failed to copy APK release asset to $ASSET_PATH"
            exit 1
          fi
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset at temporary path."

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_release_asset.outputs.asset_path }}
        run: |
          gh --version
          if [ -z "${ASSET_PATH:-}" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Prepared APK release asset does not exist or is empty."
            exit 1
          fi
          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "ERROR: Prepared release asset does not end in .apk: $ASSET_PATH"
              exit 1
              ;;
          esac
          if [ "$(basename "$ASSET_PATH")" != "app-debug.apk" ]; then
            echo "ERROR: Release asset filename must be exactly app-debug.apk."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          NOTES_FILE="$(mktemp "${RUNNER_TEMP}/release-notes.XXXXXX.md")"
          printf '%s\n' \
            "This is an automatically generated debug APK built by GitHub Actions." \
            "" \
            "- GitHub Actions run number: ${GITHUB_RUN_NUMBER}" \
            "- GitHub Actions run attempt: ${GITHUB_RUN_ATTEMPT}" \
            "- Source commit SHA: ${GITHUB_SHA}" \
            "- Intended for testing only (not a Google Play Store production release)." \
            "- Signed only with a temporary debug keystore." \
            > "$NOTES_FILE"

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --target "$GITHUB_SHA" \
            --notes-file "$NOTES_FILE" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_OUTCOME: ${{ steps.publish_release.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload_artifact.outcome }}
        run: |
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

          if [ "$PUBLISH_OUTCOME" = "success" ]; then
            echo "GitHub Release published successfully."
            gh release view "$RELEASE_TAG"
            RELEASE_URL="$(gh release view "$RELEASE_TAG" --json url -q .url)"
            echo "Release tag: $RELEASE_TAG"
            echo "Release title: $RELEASE_TITLE"
            echo "Release page URL: $RELEASE_URL"
            echo "APK filename: app-debug.apk"
            echo "DIRECT APK DOWNLOAD: $DIRECT_URL"
            echo "Backup Actions artifact 'app-debug-apk' remains available."
            {
              echo "### DIRECT APK DOWNLOAD"
              echo ""
              echo "$DIRECT_URL"
              echo ""
              echo "- Release tag: \`$RELEASE_TAG\`"
              echo "- Release title: $RELEASE_TITLE"
              echo "- Release page: $RELEASE_URL"
              echo "- Asset filename: \`app-debug.apk\`"
              echo "- Backup Actions artifact \`app-debug-apk\` remains available."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: Publishing APK to GitHub Releases failed (outcome: $PUBLISH_OUTCOME)."
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ] && [ -s "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "The debug APK build succeeded at app/build/outputs/apk/debug/app-debug.apk."
            else
              echo "The debug APK was not produced."
            fi
            if [ "$UPLOAD_OUTCOME" = "success" ]; then
              echo "The backup Actions artifact named 'app-debug-apk' remains available."
            fi
            {
              echo "### GitHub Release Publishing Warning"
              echo ""
              echo "Release publishing did not succeed for tag \`$RELEASE_TAG\`."
              if [ "$UPLOAD_OUTCOME" = "success" ]; then
                echo "The debug APK build succeeded and the Actions artifact \`app-debug-apk\` remains available."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi
